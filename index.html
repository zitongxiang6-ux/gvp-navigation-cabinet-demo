          <div class="brand-mark" title="HDL GraView">
            <span>G</span>
          </div>
          <nav class="side-nav">
            <!-- 临时隐藏首页、导航入口：路由、页面和实现代码保留，恢复时移除 is-temporarily-hidden。 -->
            <button class="side-nav-item is-temporarily-hidden" type="button" data-page="overview" aria-label="首页">
              <svg><use href="#i-home"></use></svg>
            </button>
            <button class="side-nav-item is-temporarily-hidden" type="button" data-page="navigation" aria-label="导航">
              <svg><use href="#i-menu"></use></svg>
            </button>
            <button class="side-nav-item" type="button" data-page="cabinet-functions" aria-label="配电箱功能查询" title="配电箱功能查询">
              <svg><use href="#i-cabinet"></use></svg>

            <button class="side-nav-item" type="button" data-page="history" aria-label="历史记录">
              <svg><use href="#i-clock"></use></svg>
            </button>
            <button class="side-nav-item" type="button" data-page="devices" aria-label="设备管理">
              <svg><use href="#i-device"></use></svg>
            </button>
          </nav>

        <button class="side-nav-item side-bottom" type="button" data-action="show-rules" aria-label="Demo 说明">

          <div class="topbar-actions">
            <button class="demo-chip" type="button" data-action="show-rules">
              <span class="demo-dot"></span>
              评审 Demo
            </button>
            <div class="license-chip">Temporary license to 2028-05-01 (1500)</div>
            <button class="icon-button notification-button" type="button" aria-label="消息">

              <span class="notification-count">4</span>
            </button>
            <div class="top-divider"></div>
            <button class="user-menu" type="button" data-action="show-user-menu">
